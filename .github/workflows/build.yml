# Analyse og tester ved hver endring, og bygg for Windows og Android, med versjon, byggnummer og commit i
# appens meny. Hver push til main oppdaterer releasen «testbygg» (Windows-zip og APK-er); Fyrlys på Windows
# ser etter nye bygg der og oppdaterer seg selv.
# Plattformmappene lages av «flutter create» her; i repoet ligger bare det vi har tilpasset
# (AndroidManifest, ikoner, TV-banner og Windows-ikonet), og det skrives ikke over.
# En release (Windows-zip og Android-APK-er, v0.x som forhåndsutgivelse) lages av en tag som v0.1.0, eller med
#   gh workflow run build.yml --repo ungerdas/fyrlys -f release=v0.1.0
# (tagger kan ikke pushes fra Claude-økta, men den kan starte workflowen).
# Feiler et steg, legges slutten av loggen som merknad på kjøringen (kan leses med
# «gh api repos/ungerdas/fyrlys/check-runs/<jobb-id>/annotations»).
name: Bygg

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Lag en release med denne versjonen, f.eks. v0.1.0 (tomt: bare bygg)"
        required: false
        default: ""

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Analyse og tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version | tee version.log
      - run: flutter pub get 2>&1 | tee pub.log
      - run: flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
      - run: flutter test 2>&1 | tee test.log
      - name: Vis feilen som merknad
        if: failure()
        run: |
          for f in *.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 60 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$msg"
          done

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Lag resten av Windows-oppsettet
        run: |
          flutter create --org no.peag --project-name fyrlys --platforms=windows . 2>&1 | tee create.log
          sed -i 's/L"fyrlys"/L"Fyrlys"/' windows/runner/main.cpp
          sed -i 's/VALUE "FileDescription", "fyrlys"/VALUE "FileDescription", "Fyrlys"/; s/VALUE "ProductName", "fyrlys"/VALUE "ProductName", "Fyrlys"/; s/VALUE "CompanyName", "no.peag"/VALUE "CompanyName", "Fyrlys"/' windows/runner/Runner.rc
          grep -n 'L"Fyrlys"' windows/runner/main.cpp
      - name: Versjon og byggnummer til appen (vises i menyen)
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          echo "DEFINES=--dart-define=FYRLYS_VERSION=$version --dart-define=FYRLYS_BUILD=${{ github.run_number }} --dart-define=FYRLYS_COMMIT=${GITHUB_SHA::7} --dart-define=FYRLYS_REPO=${{ github.repository }}" | tee -a "$GITHUB_ENV"
      - run: flutter build windows --release $DEFINES 2>&1 | tee build.log
      - uses: actions/upload-artifact@v5
        with:
          name: Fyrlys-windows
          path: build/windows/x64/runner/Release/
      - name: Vis feilen som merknad
        if: failure()
        run: |
          for f in *.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 60 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$msg"
          done

  android:
    name: Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Lag resten av Android-oppsettet
        run: flutter create --org no.peag --project-name fyrlys --platforms=android . 2>&1 | tee create.log
      - name: Versjon og byggnummer til appen (vises i menyen)
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          echo "DEFINES=--dart-define=FYRLYS_VERSION=$version --dart-define=FYRLYS_BUILD=${{ github.run_number }} --dart-define=FYRLYS_COMMIT=${GITHUB_SHA::7} --dart-define=FYRLYS_REPO=${{ github.repository }}" | tee -a "$GITHUB_ENV"
      - run: flutter build apk --release --split-per-abi $DEFINES 2>&1 | tee build.log
      - uses: actions/upload-artifact@v5
        with:
          name: Fyrlys-android
          path: build/app/outputs/flutter-apk/*-release.apk
      - name: Vis feilen som merknad
        if: failure()
        run: |
          for f in *.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 60 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$msg"
          done

  testbygg:
    name: Testbygg på Releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, android]
    runs-on: ubuntu-latest
    # to pusher rett etter hverandre skal ikke oppdatere releasen samtidig
    concurrency:
      group: testbygg
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 30
      - uses: actions/download-artifact@v5
        with:
          path: dist
      - name: Pakk filene og skriv endringene
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          # appen leser byggnummeret fra navnet («bygg N»)
          echo "TITLE=Fyrlys $version · bygg ${{ github.run_number }} (${GITHUB_SHA::7})" | tee -a "$GITHUB_ENV"
          mkdir -p out
          (cd dist/Fyrlys-windows && zip -qr ../../out/Fyrlys-testbygg-windows.zip .)
          for f in dist/Fyrlys-android/*.apk; do
            abi=$(basename "$f" | sed 's/^app-//; s/-release\.apk$//')
            cp "$f" "out/Fyrlys-testbygg-android-${abi}.apk"
          done
          ls -la out
          {
            echo "Siste bygg fra main, laget automatisk ved hver endring. Fyrlys på Windows oppdaterer seg selv herfra."
            echo
            echo "Siste endringer:"
            git log -10 --format='- %s (%h)' | sed 's/^- Fyrlys: /- /'
          } > notes.md
          cat notes.md
      - name: Oppdater releasen «testbygg»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f testbygg "$GITHUB_SHA"
          git push -f origin refs/tags/testbygg
          if gh release view testbygg > /dev/null 2>&1; then
            # filene først, så navnet: appen tror ikke at et nytt bygg er klart før filene er der
            gh release upload testbygg out/* --clobber
            gh release edit testbygg --title "$TITLE" --notes-file notes.md --prerelease
          else
            gh release create testbygg out/* --title "$TITLE" --notes-file notes.md --prerelease --verify-tag
          fi
      - name: Vis feilen som merknad
        if: failure()
        run: echo "::error title=testbygg::Releasen testbygg ble ikke oppdatert, se loggen for jobben"

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: [windows, android]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.release || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
      - name: Pakk filene
        run: |
          cd dist
          (cd Fyrlys-windows && zip -qr "../Fyrlys-${VERSION}-windows.zip" .)
          for f in Fyrlys-android/*.apk; do
            abi=$(basename "$f" | sed 's/^app-//; s/-release\.apk$//')
            cp "$f" "Fyrlys-${VERSION}-android-${abi}.apk"
          done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Fyrlys ${{ env.VERSION }}
          files: |
            dist/Fyrlys-*-windows.zip
            dist/Fyrlys-*-android-*.apk
          prerelease: ${{ startsWith(env.VERSION, 'v0.') }}
          generate_release_notes: true
