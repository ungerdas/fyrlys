# Analyse og tester ved hver endring, og bygg for Windows og Android, med versjon, byggnummer og commit i
# appens meny. Hver push til main oppdaterer releasen «testbygg» (Windows-zip og APK-er); Fyrlys på Windows
# ser etter nye bygg der og oppdaterer seg selv.
# Plattformmappene lages av «flutter create» her; i repoet ligger bare det vi har tilpasset
# (AndroidManifest, ikoner, TV-banner og Windows-ikonet), og det skrives ikke over.
# En release (Windows-zip og Android-APK-er, v0.x som forhåndsutgivelse) lages av en tag som v2.0.0, eller med
#   gh workflow run build.yml --repo ungerdas/fyrlys -f release=v2.0.0
# Teksten i releasen er avsnittet for versjonen i CHANGELOG.md.
# (tagger kan ikke pushes fra Claude-økta, men den kan starte workflowen).
# Feiler et steg, legges slutten av loggen som merknad på kjøringen (kan leses med
# «gh api repos/ungerdas/fyrlys/check-runs/<jobb-id>/annotations»).
name: Bygg

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Lag en release med denne versjonen, f.eks. v2.0.0 (tomt: bare bygg)"
        required: false
        default: ""

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Analyse og tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version | tee version.log
      - run: flutter pub get 2>&1 | tee pub.log
      - run: flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
      - run: flutter test 2>&1 | tee test.log
      - name: Vis feilen som merknad
        if: failure()
        run: |
          for f in *.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 60 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$msg"
          done

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Lag resten av Windows-oppsettet
        run: |
          flutter create --org no.peag --project-name fyrlys --platforms=windows . 2>&1 | tee create.log
          sed -i 's/L"fyrlys"/L"Fyrlys"/' windows/runner/main.cpp
          sed -i 's/VALUE "FileDescription", "fyrlys"/VALUE "FileDescription", "Fyrlys"/; s/VALUE "ProductName", "fyrlys"/VALUE "ProductName", "Fyrlys"/; s/VALUE "CompanyName", "no.peag"/VALUE "CompanyName", "Fyrlys"/' windows/runner/Runner.rc
          grep -n 'L"Fyrlys"' windows/runner/main.cpp
      - name: Versjon og byggnummer til appen (vises i menyen)
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          echo "DEFINES=--build-number=${{ github.run_number }} --dart-define=FYRLYS_VERSION=$version --dart-define=FYRLYS_BUILD=${{ github.run_number }} --dart-define=FYRLYS_COMMIT=${GITHUB_SHA::7} --dart-define=FYRLYS_REPO=${{ github.repository }}" | tee -a "$GITHUB_ENV"
      - run: flutter build windows --release $DEFINES 2>&1 | tee build.log
      - uses: actions/upload-artifact@v5
        with:
          name: Fyrlys-windows
          path: build/windows/x64/runner/Release/
      - name: Vis feilen som merknad
        if: failure()
        run: |
          for f in *.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 60 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$msg"
          done

  android:
    name: Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Lag resten av Android-oppsettet
        run: flutter create --org no.peag --project-name fyrlys --platforms=android . 2>&1 | tee create.log
      - name: Versjon og byggnummer til appen (vises i menyen)
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          echo "DEFINES=--build-number=${{ github.run_number }} --dart-define=FYRLYS_VERSION=$version --dart-define=FYRLYS_BUILD=${{ github.run_number }} --dart-define=FYRLYS_COMMIT=${GITHUB_SHA::7} --dart-define=FYRLYS_REPO=${{ github.repository }}" | tee -a "$GITHUB_ENV"
      - run: flutter build apk --release --split-per-abi $DEFINES 2>&1 | tee build.log
      # Med Fyrlys-nøkkelen (hemmelighetene ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD og ANDROID_KEY_ALIAS,
      # se README) kan nye APK-er installeres oppå de gamle. Uten den signeres hvert bygg med en ny, tilfeldig
      # debug-nøkkel, og appen må avinstalleres før et nytt bygg kan legges inn.
      - name: Signer med Fyrlys-nøkkelen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning title=Android::Ingen Fyrlys-nøkkel (ANDROID_KEYSTORE_B64): APK-ene har en tilfeldig debug-nøkkel"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fyrlys.jks"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            "$bt/apksigner" sign --ks "$RUNNER_TEMP/fyrlys.jks" --ks-pass env:KS_PASS --key-pass env:KS_PASS \
              --ks-key-alias "${KEY_ALIAS:-fyrlys}" "$f"
            "$bt/apksigner" verify --print-certs "$f" | head -2
          done 2>&1 | tee sign.log
          rm -f "$RUNNER_TEMP/fyrlys.jks"
      - uses: actions/upload-artifact@v5
        with:
          name: Fyrlys-android
          path: build/app/outputs/flutter-apk/*-release.apk
      - name: Vis feilen som merknad
        if: failure()
        run: |
          for f in *.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 60 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$msg"
          done

  testbygg:
    name: Testbygg på Releases
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, android]
    runs-on: ubuntu-latest
    # to pusher rett etter hverandre skal ikke oppdatere releasen samtidig
    concurrency:
      group: testbygg
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 30
      - uses: actions/download-artifact@v5
        with:
          path: dist
      - name: Pakk filene og skriv endringene
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          build=${{ github.run_number }}
          # Appen leser byggnummeret fra en skjult kommentar i teksten (2.1.9 og nyere). Apper til og med 2.1.8 leser
          # det fra navnet, så 2.1.9 (broen dit) har det der også; senere versjoner heter bare «Fyrlys X».
          if [ "$version" = "2.1.9" ]; then
            echo "TITLE=Fyrlys $version · bygg $build" | tee -a "$GITHUB_ENV"
          else
            echo "TITLE=Fyrlys $version" | tee -a "$GITHUB_ENV"
          fi
          mkdir -p out
          (cd dist/Fyrlys-windows && zip -qr ../../out/Fyrlys-testbygg-windows.zip .)
          for f in dist/Fyrlys-android/*.apk; do
            abi=$(basename "$f" | sed 's/^app-//; s/-release\.apk$//')
            cp "$f" "out/Fyrlys-testbygg-android-${abi}.apk"
          done
          ls -la out
          # det som er nytt i versjonen (avsnittet «## vX.Y.Z» i CHANGELOG.md), og byggnummeret skjult
          awk -v v="## v${version}" 'index($0, v) == 1 {on = 1; next} /^## / && on {exit} on' CHANGELOG.md > changes.md || true
          {
            echo "Nyeste versjon av Fyrlys. På Windows oppdaterer appen seg selv herfra."
            echo
            if [ -s changes.md ]; then cat changes.md; fi
            [ "$version" = "2.1.9" ] || printf '\n<!-- bygg %s -->\n' "$build"
          } > notes.md
          cat notes.md
      - name: Oppdater releasen «testbygg»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f testbygg "$GITHUB_SHA"
          git push -f origin refs/tags/testbygg
          if gh release view testbygg > /dev/null 2>&1; then
            # filene først, så navnet: appen tror ikke at et nytt bygg er klart før filene er der
            gh release upload testbygg out/* --clobber
            gh release edit testbygg --title "$TITLE" --notes-file notes.md --prerelease
          else
            gh release create testbygg out/* --title "$TITLE" --notes-file notes.md --prerelease --verify-tag
          fi
      - name: Vis feilen som merknad
        if: failure()
        run: echo "::error title=testbygg::Releasen testbygg ble ikke oppdatert, se loggen for jobben"

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: [windows, android]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.release || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
      - name: Teksten fra CHANGELOG.md
        run: |
          # avsnittet «## v2.0.0 …» fram til neste «## »
          awk -v v="## ${VERSION}" 'index($0, v) == 1 {on = 1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "Fyrlys ${VERSION}" > notes.md
          cat notes.md
      - name: Pakk filene
        run: |
          cd dist
          (cd Fyrlys-windows && zip -qr "../Fyrlys-${VERSION}-windows.zip" .)
          for f in Fyrlys-android/*.apk; do
            abi=$(basename "$f" | sed 's/^app-//; s/-release\.apk$//')
            cp "$f" "Fyrlys-${VERSION}-android-${abi}.apk"
          done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Fyrlys ${{ env.VERSION }}
          files: |
            dist/Fyrlys-*-windows.zip
            dist/Fyrlys-*-android-*.apk
          prerelease: ${{ startsWith(env.VERSION, 'v0.') }}
          body_path: notes.md
          make_latest: true
