# Analyse og tester ved hver endring, og bygg for Windows og Android (arm64, arm og x86_64), med versjon og byggnummer i appen.
# Hver push til main legger ut versjonen i pubspec.yaml som en release «vX.Y.Z» (Fyrlys-oppsett.exe,
# Fyrlys-windows.zip og Fyrlys-android.apk, faste navn; Windows-appen oppdaterer seg selv fra zip-fila, Android-appen
# laster ned APK-en), som blir «Latest». Teksten er avsnittet for versjonen i CHANGELOG.md, og byggnummeret står
# skjult i den (<!-- bygg N -->); appen ser etter nye versjoner der.
# Er versjonen ikke endret, byttes filene i releasen den har fra før.
# APK-en signeres med Fyrlys-nøkkelen (hemmelighetene ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD og
# ANDROID_KEY_ALIAS), så nye versjoner kan installeres oppå de gamle. Uten nøkkelen bygges den, men legges ikke ut.
# Windows- og Android-mappene lages av «flutter create» her; i repoet ligger bare det som er tilpasset (ikonene,
# installasjonsprogrammet, Android-manifestet og Kotlin-filene), og det skrives ikke over.
# Feiler et steg, legges slutten av loggen som merknad på kjøringen (kan leses med
# «gh api repos/ungerdas/fyrlys/check-runs/<jobb-id>/annotations»).
name: Bygg

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Analyse og tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version | tee version.log
      - run: flutter pub get 2>&1 | tee pub.log
      - run: flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
      - run: flutter test 2>&1 | tee test.log
      - name: Vis feilen som merknad
        if: failure()
        run: |
          for f in *.log; do
            [ -f "$f" ] || continue
            if [ "$f" = test.log ] && grep -q '❌' "$f"; then
              # alle testene som feilet, så detaljene (lange linjer, som advarsler om trykk, tas ikke med)
              names=$(grep '::group::❌' "$f" | sed 's/.*::group::❌ //' | head -n 40)
              details=$(awk '/::group::❌/{on=1} on && length($0) < 400 {print} /::endgroup::/{on=0}' "$f" | head -n 80)
              body=$(printf 'Feilet:\n%s\n\n%s' "$names" "$details")
            else
              body=$(tail -n 60 "$f")
            fi
            msg=$(printf '%s\n' "$body" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$msg"
          done

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Lag resten av Windows-oppsettet
        run: |
          flutter create --org no.fyrlys --project-name fyrlys --platforms=windows . 2>&1 | tee create.log
          sed -i 's/L"fyrlys"/L"Fyrlys"/' windows/runner/main.cpp
          # filinfoen i exe-en: bare «Fyrlys». CompanyName og ProductName bestemmer også mappen innstillingene og
          # innloggingen ligger i (%APPDATA%\Fyrlys\Fyrlys), så de må aldri endres; bygget stopper om de ikke stemmer.
          sed -i 's/VALUE "FileDescription", "[^"]*"/VALUE "FileDescription", "Fyrlys"/; s/VALUE "ProductName", "[^"]*"/VALUE "ProductName", "Fyrlys"/; s/VALUE "CompanyName", "[^"]*"/VALUE "CompanyName", "Fyrlys"/; s/VALUE "LegalCopyright", "[^"]*"/VALUE "LegalCopyright", "Fyrlys"/' windows/runner/Runner.rc
          grep -n 'L"Fyrlys"' windows/runner/main.cpp
          grep -n 'VALUE "CompanyName", "Fyrlys"' windows/runner/Runner.rc
          grep -n 'VALUE "ProductName", "Fyrlys"' windows/runner/Runner.rc
          grep -n 'VALUE "LegalCopyright", "Fyrlys"' windows/runner/Runner.rc
      - name: Versjon og byggnummer til appen (vises i menyen)
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          echo "DEFINES=--build-number=${{ github.run_number }} --dart-define=FYRLYS_VERSION=$version --dart-define=FYRLYS_BUILD=${{ github.run_number }} --dart-define=FYRLYS_COMMIT=${GITHUB_SHA::7} --dart-define=FYRLYS_REPO=${{ github.repository }}" | tee -a "$GITHUB_ENV"
      - run: flutter build windows --release $DEFINES 2>&1 | tee build.log
      # Avspilleren: libmpv-2.dll fra media_kit har bare et lite utvalg av FFmpeg (ingen deinterlacing, ikke
      # deinterlace=auto). Den byttes med et fullt LGPL-bygg fra mpv-winbuild. Byggene der ryddes bort etter en tid, så
      # Fyrlys tar vare på arkivet i sin egen forhåndsrelease «libmpv-<tag>» og henter det derfra når det finnes.
      - name: Full libmpv (LGPL)
        env:
          GH_TOKEN: ${{ github.token }}
          MPV_TAG: 2026-10-26-baa3e11d42
          MPV_PATTERN: mpv-dev-lgpl-x86_64-2*.7z
        run: |
          # alt også i libmpv.log, så det kommer med i merknaden om noe feiler
          exec > >(tee libmpv.log) 2>&1
          mkdir -p libmpv && cd libmpv
          if gh release download "libmpv-$MPV_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$MPV_PATTERN" 2>/dev/null; then
            echo "Fra Fyrlys sin kopi (libmpv-$MPV_TAG)"
          else
            if ! gh release download "$MPV_TAG" --repo zhongfly/mpv-winbuild --pattern "$MPV_PATTERN" --pattern sha256.txt; then
              echo "Filene i $MPV_TAG:"; gh release view "$MPV_TAG" --repo zhongfly/mpv-winbuild --json assets --jq '.assets[].name' || true
              echo "Siste releaser:"; gh release list --repo zhongfly/mpv-winbuild --limit 5 || true
              exit 1
            fi
            name=$(ls $MPV_PATTERN)
            expected=$(grep " $name" sha256.txt | cut -d' ' -f1)
            actual=$(sha256sum "$name" | cut -d' ' -f1)
            echo "$name: $actual (ventet $expected)"
            test -n "$expected" && test "$expected" = "$actual"
            if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" = push ]; then
              gh release create "libmpv-$MPV_TAG" "$name" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
                --title "libmpv $MPV_TAG" \
                --notes "Avspilleren Fyrlys bygges med (libmpv-2.dll, LGPL), fra https://github.com/zhongfly/mpv-winbuild/releases/tag/$MPV_TAG. Ikke en versjon av Fyrlys." \
                || echo "Kopien ble ikke lagt ut (finnes den alt?)"
            fi
          fi
          7z e -y $MPV_PATTERN libmpv-2.dll > /dev/null
          release=../build/windows/x64/runner/Release
          test -f "$release/libmpv-2.dll"
          ls -l "$release/libmpv-2.dll" libmpv-2.dll
          cp -f libmpv-2.dll "$release/libmpv-2.dll"
      # Visual C++-runtime ved siden av fyrlys.exe: exe-en og programtilleggene trenger msvcp140.dll m.fl., og de finnes
      # ikke på en Windows uten «Microsoft Visual C++ Redistributable» (eieren 3.11 på en annen PC: «MSVCP140.dll ikke
      # ble funnet»). Microsoft lar dem ligge i programmappen. Etterpå sjekker dumpbin at alt exe-en og dll-ene trenger
      # av VC-runtime, ligger der, og hva de ellers henter fra Windows logges.
      - name: Visual C++-runtime i programmappen
        shell: python
        run: |
          import glob, os, re, shutil, subprocess, sys
          out = open("vcruntime.log", "w", encoding="utf-8")
          def say(*a):
              line = " ".join(str(x) for x in a)
              print(line); out.write(line + "\n"); out.flush()
          rel = os.path.abspath("build/windows/x64/runner/Release")
          vswhere = os.path.expandvars(r"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe")
          vs = subprocess.check_output([vswhere, "-latest", "-products", "*", "-requires",
                                        "Microsoft.VisualStudio.Component.VC.Tools.x86.x64", "-property",
                                        "installationPath"], text=True).strip()
          crt = sorted(glob.glob(os.path.join(vs, r"VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT")))
          if not crt:
              say("fant ikke Microsoft.VC*.CRT under", vs)
              sys.exit(1)
          say("fra", crt[-1])
          for f in sorted(os.listdir(crt[-1])):
              if f.lower().endswith(".dll"):
                  shutil.copy2(os.path.join(crt[-1], f), rel)
                  say("  ", f)
          dumpbin = sorted(glob.glob(os.path.join(vs, r"VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe")))[-1]
          have = {f.lower() for f in os.listdir(rel)}
          imports = {}
          for b in sorted(glob.glob(os.path.join(rel, "*.exe")) + glob.glob(os.path.join(rel, "*.dll"))):
              text = subprocess.run([dumpbin, "/nologo", "/dependents", b], capture_output=True, text=True).stdout
              imports[os.path.basename(b).lower()] = {n.lower() for n in re.findall(r"^\s+(\S+\.dll)\s*$", text, re.M | re.I)}
          # det som lastes når fyrlys.exe starter (exe-en og dll-ene den henter, og de de henter); resten lastes bare
          # når appen ber om det (FFI)
          started, todo = set(), ["fyrlys.exe"]
          while todo:
              b = todo.pop()
              if b in started or b not in imports:
                  continue
              started.add(b)
              todo.extend(n for n in imports[b] if n in have)
          vc = re.compile(r"(msvcp|vcruntime|concrt|vccorlib)\d")
          debug = re.compile(r"(ucrtbased|(msvcp|vcruntime)\d+(_\d)?d)\.dll$")
          ok = True
          for b, names in sorted(imports.items()):
              used = sorted(n for n in names if vc.match(n) or debug.match(n))
              when = "ved start" if b in started else "ved behov"
              if used:
                  say(f"{b} ({when}): {', '.join(used)}")
              for n in used:
                  if debug.match(n):
                      # feilsøkingsutgaven av runtime finnes bare der Visual Studio er installert
                      say(f"  {'FEIL' if b in started else 'ADVARSEL'}: {b} trenger {n} (Debug-bygg)")
                      ok = ok and b not in started
                  elif n not in have:
                      say(f"  FEIL: {n} mangler i programmappen")
                      ok = False
          others = sorted({n for names in imports.values() for n in names
                           if n not in have and not vc.match(n) and not debug.match(n)})
          say("fra Windows ellers:", ", ".join(others))
          if not ok:
              sys.exit(1)
      - name: Sjekk avspilleren (versjon, deinterlacing)
        shell: python
        run: |
          import ctypes, os, sys
          out = open("mpvsjekk.log", "w", encoding="utf-8")
          def say(*a):
              line = " ".join(str(x) for x in a)
              print(line); out.write(line + "\n"); out.flush()
          os.add_dll_directory(os.path.abspath("build/windows/x64/runner/Release"))
          mpv = ctypes.CDLL(os.path.abspath("build/windows/x64/runner/Release/libmpv-2.dll"))
          mpv.mpv_create.restype = ctypes.c_void_p
          mpv.mpv_get_property_string.restype = ctypes.c_void_p
          mpv.mpv_get_property_string.argtypes = [ctypes.c_void_p, ctypes.c_char_p]
          mpv.mpv_set_option_string.argtypes = [ctypes.c_void_p, ctypes.c_char_p, ctypes.c_char_p]
          mpv.mpv_initialize.argtypes = [ctypes.c_void_p]
          mpv.mpv_command.argtypes = [ctypes.c_void_p, ctypes.POINTER(ctypes.c_char_p)]
          mpv.mpv_free.argtypes = [ctypes.c_void_p]
          ctx = mpv.mpv_create()
          mpv.mpv_set_option_string(ctx, b"vo", b"null")
          assert mpv.mpv_initialize(ctx) == 0
          def prop(name):
              p = mpv.mpv_get_property_string(ctx, name.encode())
              if not p:
                  return None
              v = ctypes.string_at(p).decode()
              mpv.mpv_free(p)
              return v
          say("mpv:", prop("mpv-version"), "| ffmpeg:", prop("ffmpeg-version"))
          ok = True
          # deinterlace=auto (bare det som er interlacet) og deinterlacerne som brukes uten maskinvare
          r = mpv.mpv_set_option_string(ctx, b"deinterlace", b"auto")
          say("deinterlace=auto:", r)
          if r != 0:
              ok = False
          def vf_add(name):
              r = mpv.mpv_command(ctx, (ctypes.c_char_p * 4)(b"vf", b"add", name.encode(), None))
              mpv.mpv_command(ctx, (ctypes.c_char_p * 4)(b"vf", b"clr", b"", None))
              return r
          control = vf_add("finnes-ikke")
          for f in ("bwdif", "yadif"):
              r = vf_add(f)
              say(f"vf add {f}: {r} (et filter som ikke finnes: {control})")
              if f == "bwdif" and control != 0 and r != 0:
                  ok = False
          # «Fjern striper» i TV: kjeden appen bruker (tvDeinterlace i lib/ui/playback.dart, ett bilde ut per bilde inn)
          # mot mpv sin egen (ett bilde per halvbilde), med en liten interlacet fil: 25 bilder/s, øverste halvbilde
          # først, en stripe som flytter seg og står forskjøvet i det andre halvbildet.
          import re, time
          chain = re.search(r"tvDeinterlace = '([^']+)'", open("lib/ui/playback.dart", encoding="utf-8").read()).group(1)
          w, h, n = 160, 120, 100
          with open("interlacet.y4m", "wb") as f:
              f.write(f"YUV4MPEG2 W{w} H{h} F25:1 It A1:1 C420jpeg\n".encode())
              for i in range(n):
                  f.write(b"FRAME\n")
                  y = bytearray(b"\x10" * (w * h))
                  for row in range(h):
                      x0 = (i * 6 + (row % 2) * 3) % (w - 12)
                      y[row * w + x0: row * w + x0 + 12] = b"\xeb" * 12
                  f.write(bytes(y))
                  f.write(b"\x80" * (w * h // 2))
          mpv.mpv_wait_event.restype = ctypes.c_void_p
          mpv.mpv_wait_event.argtypes = [ctypes.c_void_p, ctypes.c_double]
          mpv.mpv_terminate_destroy.argtypes = [ctypes.c_void_p]
          def play(vf, deinterlace):
              m = mpv.mpv_create()
              for k, v in (("vo", "null"), ("ao", "null"), ("loop-file", "inf"), ("vf", vf), ("deinterlace", deinterlace)):
                  r = mpv.mpv_set_option_string(m, k.encode(), v.encode())
                  if r != 0:
                      say(f"  {k}={v}: {r}")
              assert mpv.mpv_initialize(m) == 0
              mpv.mpv_command(m, (ctypes.c_char_p * 3)(b"loadfile", b"interlacet.y4m", None))
              end = time.time() + 2.5
              while time.time() < end:
                  mpv.mpv_wait_event(m, 0.1)
              def get(name):
                  p = mpv.mpv_get_property_string(m, name.encode())
                  if not p:
                      return None
                  v = ctypes.string_at(p).decode()
                  mpv.mpv_free(p)
                  return v
              res = {k: get(k) for k in ("estimated-vf-fps", "video-frame-info/interlaced", "deinterlace-active", "vf")}
              mpv.mpv_terminate_destroy(m)
              return res
          def fps(r):
              try:
                  return float(r["estimated-vf-fps"])
              except (TypeError, ValueError):
                  return 0.0
          none = play("", "no")
          own = play("", "auto")
          ours = play(chain, "no")
          say("uten deinterlacing:", none)
          say("mpv sin egen (deinterlace=auto):", own)
          say("Fyrlys (tvDeinterlace):", ours)
          if none["video-frame-info/interlaced"] == "yes":
              if not (20 < fps(ours) < 30 and ours["video-frame-info/interlaced"] == "no"):
                  say("FEIL: tvDeinterlace ga ikke 25 bilder/s uten striper")
                  ok = False
          else:
              say("ADVARSEL: fila ble ikke sett som interlacet, så tvDeinterlace er ikke prøvd")
          sys.exit(0 if ok else 1)
      - uses: actions/upload-artifact@v7
        with:
          name: Fyrlys-windows
          path: build/windows/x64/runner/Release/
      # Fyrlys-oppsett.exe: installerer for brukeren i %LOCALAPPDATA%\Programs\Fyrlys (windows/installer/fyrlys.iss)
      - name: Installasjonsprogrammet (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" "/DSource=$PWD\build\windows\x64\runner\Release" "/DOutputDir=$PWD\installer-out" windows\installer\fyrlys.iss 2>&1 | Tee-Object -FilePath iscc.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item installer-out\Fyrlys-oppsett.exe | Format-List Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: Fyrlys-oppsett
          path: installer-out/Fyrlys-oppsett.exe
      - name: Vis feilen som merknad
        if: failure()
        run: |
          for f in *.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 60 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$msg"
          done

  android:
    name: Android
    needs: test
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Lag resten av Android-oppsettet
        run: flutter create --org no.fyrlys --project-name fyrlys --platforms=android . 2>&1 | tee create.log
      - name: Versjon og byggnummer til appen (vises i menyen)
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          echo "DEFINES=--build-number=${{ github.run_number }} --dart-define=FYRLYS_VERSION=$version --dart-define=FYRLYS_BUILD=${{ github.run_number }} --dart-define=FYRLYS_COMMIT=${GITHUB_SHA::7} --dart-define=FYRLYS_REPO=${{ github.repository }}" | tee -a "$GITHUB_ENV"
      # Alle tre (arm64, arm og x86_64) i én APK. Avspilleren (libmpv fra media_kit) følger med for alle tre uansett;
      # med Flutter bare for arm64 valgte Android en av de andre i BlueStacks og på 32-bit-telefoner, og appen ble et
      # hvitt vindu (2.1.26–2.1.28). x86_64 gjør at den kjører rett i emulatorer som BlueStacks (64-bit).
      - run: flutter build apk --release $DEFINES 2>&1 | tee build.log
      - name: Signer med Fyrlys-nøkkelen
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # alt også i sign.log (uten hemmelighetene), så det kommer med i merknaden om noe feiler
          exec > >(tee sign.log) 2>&1
          apk=build/app/outputs/flutter-apk/app-release.apk
          ls -l "$apk"
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning title=Android::Ingen Fyrlys-nøkkel (hemmeligheten ANDROID_KEYSTORE_B64), så APK-en legges ikke i releasen"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ks="$RUNNER_TEMP/fyrlys.jks"
          # mellomrom, linjeskift (også \r når teksten er limt inn fra Windows) og linjene «-----BEGIN/END …-----» som
          # certutil -encode lager, tas bort før den pakkes ut; base64url (- og _) godtas også
          clean=$(printf '%s' "$KEYSTORE_B64" | sed '/-----/d' | tr -d ' \r\n\t' | tr '_-' '/+')
          bad=$(printf '%s' "$clean" | tr -d 'A-Za-z0-9+/=' | wc -c)
          if [ "$bad" -gt 0 ] || ! printf '%s' "$clean" | base64 -d > "$ks" 2>/dev/null || [ ! -s "$ks" ]; then
            echo "ANDROID_KEYSTORE_B64 er ikke gyldig base64 (${#clean} tegn, $bad av dem hører ikke hjemme i base64)."
            echo "Lag den med: base64 -w0 fyrlys.jks > fyrlys.jks.b64, og legg den inn med"
            echo "gh secret set ANDROID_KEYSTORE_B64 -R ungerdas/fyrlys < fyrlys.jks.b64"
            exit 1
          fi
          echo "Nøkkelfila: $(stat -c %s "$ks") byte ($(file -b "$ks" | cut -c1-60))"
          if ! keytool -list -keystore "$ks" -storepass:env KS_PASS > "$RUNNER_TEMP/keytool.txt" 2>&1; then
            echo "Nøkkelfila kunne ikke åpnes med ANDROID_KEYSTORE_PASSWORD (feil passord, eller ikke en nøkkelfil):"
            grep -iv 'password' "$RUNNER_TEMP/keytool.txt" | head -5
            exit 1
          fi
          alias="${KEY_ALIAS:-fyrlys}"
          if ! keytool -list -keystore "$ks" -storepass:env KS_PASS -alias "$alias" > /dev/null 2>&1; then
            echo "Fant ikke nøkkelen ANDROID_KEY_ALIAS i fila. Nøklene som finnes:"
            grep -i 'PrivateKeyEntry' "$RUNNER_TEMP/keytool.txt" | cut -d, -f1 | sed 's/^/  /'
            exit 1
          fi
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "apksigner fra $bt"
          "$bt/apksigner" sign --ks "$ks" --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --ks-key-alias "$alias" --out Fyrlys-android.apk "$apk"
          rm -f "$ks" "$RUNNER_TEMP/keytool.txt"
          "$bt/apksigner" verify --print-certs Fyrlys-android.apk | grep -i 'SHA-256'
          ls -l Fyrlys-android.apk
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.sign.outputs.signed == 'true'
        with:
          name: Fyrlys-android
          path: Fyrlys-android.apk
      - name: Vis feilen som merknad
        if: failure()
        run: |
          for f in *.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 60 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$msg"
          done

  release:
    name: Release
    # også når kjøringen startes for hånd på main (f.eks. for å få APK-en med etter at signeringsnøkkelen er lagt inn)
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [windows, android]
    runs-on: ubuntu-latest
    # to pusher rett etter hverandre skal ikke oppdatere releasene samtidig
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      # med navn og mappe: er det bare én artefakt og ingen navn, pakkes den rett i «dist» uten egen mappe
      - uses: actions/download-artifact@v8
        with:
          name: Fyrlys-windows
          path: dist/Fyrlys-windows
      - uses: actions/download-artifact@v8
        with:
          name: Fyrlys-oppsett
          path: dist/Fyrlys-oppsett
      - uses: actions/download-artifact@v8
        if: needs.android.outputs.signed == 'true'
        with:
          name: Fyrlys-android
          path: dist/Fyrlys-android
      - name: Pakk filene og skriv teksten
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          build=${{ github.run_number }}
          # faste filnavn, så «releases/latest/download/Fyrlys-windows.zip» alltid gir siste versjon
          mkdir -p out
          (cd dist/Fyrlys-windows && zip -qr ../../out/Fyrlys-windows.zip .)
          cp dist/Fyrlys-oppsett/Fyrlys-oppsett.exe out/
          # APK-en bare når den er signert med Fyrlys-nøkkelen (ellers kan den ikke oppdateres senere)
          if [ -f dist/Fyrlys-android/Fyrlys-android.apk ]; then cp dist/Fyrlys-android/Fyrlys-android.apk out/; fi
          ls -la out
          awk -v v="## v${version}" 'index($0, v) == 1 {on = 1; next} /^## / && on {exit} on' CHANGELOG.md > changes.md || true
          [ -s changes.md ] || echo "Fyrlys ${version}" > changes.md
          # byggnummeret skjult i teksten: appen leser det for å se om releasen er nyere enn den selv
          { cat changes.md; printf '\n<!-- bygg %s -->\n' "$build"; } > notes.md
          echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "TITLE=Fyrlys $version" | tee -a "$GITHUB_ENV"
          cat notes.md
      - name: Legg ut releasen
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Samme versjon på nytt: filer med andre navn fjernes først (appen tar den første fila som slutter på
            # «-windows.zip» eller «-android.apk», og den skal ikke være et gammelt bygg).
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r a; do
              [ -f "out/$a" ] || gh release delete-asset "$TAG" "$a" -y
            done
            # filene først, så teksten med byggnummeret: appen tror ikke at et nytt bygg er klart før filene er der
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md --latest
          else
            # gh lager den som utkast til filene er lastet opp, og publiserer den så
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md --latest
          fi
      - name: Vis feilen som merknad
        if: failure()
        run: echo "::error title=release::Releasen ble ikke lagt ut, se loggen for jobben"
