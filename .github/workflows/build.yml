# Analyse og tester ved hver endring, og bygg for Windows og Android, med versjon og byggnummer i appen.
# Hver push til main legger ut versjonen i pubspec.yaml som en release «vX.Y.Z» (Fyrlys-windows.zip og
# Fyrlys-android-<abi>.apk, faste navn), som blir «Latest». Teksten er avsnittet for versjonen i CHANGELOG.md, og
# byggnummeret står skjult i den (<!-- bygg N -->); Fyrlys på Windows ser etter nye versjoner der og oppdaterer seg selv.
# Er versjonen ikke endret, byttes filene i releasen den har fra før.
# Plattformmappene lages av «flutter create» her; i repoet ligger bare det vi har tilpasset
# (AndroidManifest, ikoner, TV-banner og Windows-ikonet), og det skrives ikke over.
# Feiler et steg, legges slutten av loggen som merknad på kjøringen (kan leses med
# «gh api repos/ungerdas/fyrlys/check-runs/<jobb-id>/annotations»).
name: Bygg

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Analyse og tester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version | tee version.log
      - run: flutter pub get 2>&1 | tee pub.log
      - run: flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
      - run: flutter test 2>&1 | tee test.log
      - name: Vis feilen som merknad
        if: failure()
        run: |
          for f in *.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 60 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$msg"
          done

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Lag resten av Windows-oppsettet
        run: |
          flutter create --org no.peag --project-name fyrlys --platforms=windows . 2>&1 | tee create.log
          sed -i 's/L"fyrlys"/L"Fyrlys"/' windows/runner/main.cpp
          sed -i 's/VALUE "FileDescription", "fyrlys"/VALUE "FileDescription", "Fyrlys"/; s/VALUE "ProductName", "fyrlys"/VALUE "ProductName", "Fyrlys"/; s/VALUE "CompanyName", "no.peag"/VALUE "CompanyName", "Fyrlys"/' windows/runner/Runner.rc
          grep -n 'L"Fyrlys"' windows/runner/main.cpp
      - name: Versjon og byggnummer til appen (vises i menyen)
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          echo "DEFINES=--build-number=${{ github.run_number }} --dart-define=FYRLYS_VERSION=$version --dart-define=FYRLYS_BUILD=${{ github.run_number }} --dart-define=FYRLYS_COMMIT=${GITHUB_SHA::7} --dart-define=FYRLYS_REPO=${{ github.repository }}" | tee -a "$GITHUB_ENV"
      - run: flutter build windows --release $DEFINES 2>&1 | tee build.log
      - uses: actions/upload-artifact@v5
        with:
          name: Fyrlys-windows
          path: build/windows/x64/runner/Release/
      - name: Vis feilen som merknad
        if: failure()
        run: |
          for f in *.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 60 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$msg"
          done

  android:
    name: Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Lag resten av Android-oppsettet
        run: flutter create --org no.peag --project-name fyrlys --platforms=android . 2>&1 | tee create.log
      - name: Versjon og byggnummer til appen (vises i menyen)
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          echo "DEFINES=--build-number=${{ github.run_number }} --dart-define=FYRLYS_VERSION=$version --dart-define=FYRLYS_BUILD=${{ github.run_number }} --dart-define=FYRLYS_COMMIT=${GITHUB_SHA::7} --dart-define=FYRLYS_REPO=${{ github.repository }}" | tee -a "$GITHUB_ENV"
      - run: flutter build apk --release --split-per-abi $DEFINES 2>&1 | tee build.log
      # Med Fyrlys-nøkkelen (hemmelighetene ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD og ANDROID_KEY_ALIAS,
      # se README) kan nye APK-er installeres oppå de gamle. Uten den signeres hvert bygg med en ny, tilfeldig
      # debug-nøkkel, og appen må avinstalleres før et nytt bygg kan legges inn.
      - name: Signer med Fyrlys-nøkkelen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning title=Android::Ingen Fyrlys-nøkkel (ANDROID_KEYSTORE_B64): APK-ene har en tilfeldig debug-nøkkel"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fyrlys.jks"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in build/app/outputs/flutter-apk/*-release.apk; do
            "$bt/apksigner" sign --ks "$RUNNER_TEMP/fyrlys.jks" --ks-pass env:KS_PASS --key-pass env:KS_PASS \
              --ks-key-alias "${KEY_ALIAS:-fyrlys}" "$f"
            "$bt/apksigner" verify --print-certs "$f" | head -2
          done 2>&1 | tee sign.log
          rm -f "$RUNNER_TEMP/fyrlys.jks"
      - uses: actions/upload-artifact@v5
        with:
          name: Fyrlys-android
          path: build/app/outputs/flutter-apk/*-release.apk
      - name: Vis feilen som merknad
        if: failure()
        run: |
          for f in *.log; do
            [ -f "$f" ] || continue
            msg=$(tail -n 60 "$f" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=$f::$msg"
          done

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows, android]
    runs-on: ubuntu-latest
    # to pusher rett etter hverandre skal ikke oppdatere releasene samtidig
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
      - name: Pakk filene og skriv teksten
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          build=${{ github.run_number }}
          # faste filnavn, så «releases/latest/download/Fyrlys-windows.zip» alltid gir siste versjon
          mkdir -p out
          (cd dist/Fyrlys-windows && zip -qr ../../out/Fyrlys-windows.zip .)
          for f in dist/Fyrlys-android/*.apk; do
            abi=$(basename "$f" | sed 's/^app-//; s/-release\.apk$//')
            cp "$f" "out/Fyrlys-android-${abi}.apk"
          done
          ls -la out
          awk -v v="## v${version}" 'index($0, v) == 1 {on = 1; next} /^## / && on {exit} on' CHANGELOG.md > changes.md || true
          [ -s changes.md ] || echo "Fyrlys ${version}" > changes.md
          # Bro: apper til og med 2.1.8 ser bare etter releasen «testbygg» og leser byggnummeret i navnet. 2.1.9 legges
          # ut der en siste gang (med «bygg N» i navnet); 2.1.9 og nyere ser etter siste release (og «testbygg» som
          # reserve), så fra 2.1.10 er alt vanlige releaser, og «testbygg» slettes.
          if [ "$version" = "2.1.9" ]; then
            echo "TAG=testbygg" >> "$GITHUB_ENV"
            echo "TITLE=Fyrlys $version · bygg $build" | tee -a "$GITHUB_ENV"
            cp changes.md notes.md
          else
            echo "TAG=v$version" >> "$GITHUB_ENV"
            echo "TITLE=Fyrlys $version" | tee -a "$GITHUB_ENV"
            { cat changes.md; printf '\n<!-- bygg %s -->\n' "$build"; } > notes.md
          fi
          cat notes.md
      - name: Legg ut releasen
        run: |
          if [ "$TAG" = "testbygg" ]; then
            git tag -f testbygg "$GITHUB_SHA"
            git push -f origin refs/tags/testbygg
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Filer med andre navn (f.eks. de gamle «Fyrlys-testbygg-…») fjernes først: appen tar den første fila som
            # slutter på «-windows.zip», og den skal ikke være et gammelt bygg.
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r a; do
              [ -f "out/$a" ] || gh release delete-asset "$TAG" "$a" -y
            done
            # filene først, så teksten med byggnummeret: appen tror ikke at et nytt bygg er klart før filene er der
            gh release upload "$TAG" out/* --clobber
            if [ "$TAG" = "testbygg" ]; then
              gh release edit testbygg --title "$TITLE" --notes-file notes.md
            else
              gh release edit "$TAG" --title "$TITLE" --notes-file notes.md --latest
            fi
          elif [ "$TAG" = "testbygg" ]; then
            gh release create testbygg out/* --title "$TITLE" --notes-file notes.md --prerelease --verify-tag
          else
            # gh lager den som utkast til filene er lastet opp, og publiserer den så
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md --latest
          fi
          # «testbygg» er historie fra 2.1.10
          if [ "$TAG" != "testbygg" ] && gh release view testbygg > /dev/null 2>&1; then
            gh release delete testbygg -y --cleanup-tag
          fi
      - name: Vis feilen som merknad
        if: failure()
        run: echo "::error title=release::Releasen ble ikke lagt ut, se loggen for jobben"
