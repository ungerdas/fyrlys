name: fyrlys
description: "Fyrlys – TV fra IPTV-abonnementet ditt, med mpv som avspiller, for Windows."
publish_to: "none"
version: 2.1.21+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  # mpv som avspiller: spiller H.265, AC3, DTS, MKV, lydspor og undertekster, med maskinvaredekoding
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  # fullskjerm, og vinduet der det var sist (skjermene til å sjekke plasseringen)
  window_manager: ^0.5.1
  screen_retriever: ^0.2.0
  # kall til Windows (vindusanimasjonene av mens Fyrlys går inn og ut av fullskjerm)
  ffi: ^2.1.3
  # klokka spilleren regner pause og tilbakespoling med (testene kan spole den)
  clock: ^1.1.1
  # mapper for kanallista fra sist og bildene på disk
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fyrlys.png
